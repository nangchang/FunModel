<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FunModel — 가구 설계·방 배치</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/" } }</script>
</head>
<body>
<header>
  <button class="ib" data-a="menu" aria-label="방 목록·내보내기 메뉴">☰</button>
  <div class="seg" role="group" aria-label="작업 모드"><button data-a="mode" data-v="room">배치</button><button data-a="mode" data-v="lib">가구</button><button data-a="mode" data-v="design">설계</button></div>
  <span class="sp"></span>
  <button class="ib" data-a="undo" aria-label="되돌리기">↶</button>
  <button class="ib" data-a="redo" aria-label="다시 실행">↷</button>
  <div class="seg" role="group" aria-label="보기"><button data-a="view" data-v="3d">3D</button><button data-a="view" data-v="plan">평면</button></div>
</header>
<main id="stage">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="hud"></div>
  <button class="ib" id="fit" data-a="fit" aria-label="화면 맞춤">⤢</button>
</main>
<section id="panel" aria-label="작업 패널">
  <button id="grab" data-a="fold" aria-label="패널 접기·펼치기"></button>
  <div id="pbody"></div>
</section>
<dialog id="menu"></dialog>
<div id="toast" role="status"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script type="module" src="src/app.js"></script>
</body>
</html>
